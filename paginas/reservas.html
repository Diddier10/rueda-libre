<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu bicicleta</title>
</head>
<body>
    <a href="mailto:hola@ruedalibre.example">Enviar correo</a>
    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="../paginas/tarifas.html">Tarifas y rutas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h1>Reserva tu bicicleta</h1>
            <form action="reservar" method="POST">
                <fieldset>
                    <legend>Tus datos</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </fieldset>
                <fieldset>  </fieldset>
                    <legend>Tu alquiler</legend>
                    <label for="bicicleta">Tipo de bicicleta:</label>
                    <select id="bicicleta" name="bicicleta" required>
                        <option value="">Seleccione una opción</option>
                        <option value="urbana">Urbana</option>
                        <option value="montaña">Montaña</option>
                        <option value="electrica">Eléctrica</option>
                    </select>
                    <label for="fecha">Fecha de reserva:</label>
                    <input type="date" id="fecha" name="fecha" required>
                    <label for="hora">Hora de reserva:</label>
                    <input type="time" id="hora" name="hora" required>
                </fieldset>
                <fieldset>
                    <legend>Confirmacion</legend>
                    <label for="duracion">Duración:</label>
                    <select id="duracion" name="duracion" required>
                        <option value="">Seleccione una opción</option>
                        <option value="1hora">1 hora</option>
                        <option value="medio-dia">Medio día (4 horas)</option>
                        <option value="dia-completo">Día completo</option>
                    </select>
                </fieldset>
                <button type="submit">Reservar</button>
            </form>
        </section>
    </main>
    <section>
        <aside class="horario-atencion">
            <dl>
                <dt>Lunes</dt>
                <dd>09:00  18:00</dd>

                <dt>Martes</dt>
                <dd>09:00  18:00</dd>

                <dt>Miércoles</dt>
                <dd>09:00  18:00</dd>

                <dt>Jueves</dt>
                <dd>09:00 18:00</dd>

                <dt>Viernes</dt>
                <dd>09:00  17:00</dd>

                <dt>Sábado</dt>
                <dd>10:00  14:00</dd>

                <dt>Domingo</dt>
                <dd>Cerrado</dd>
            </dl>
        </aside>
    </section>
    <footer class="pie-pagina">

</body>
</html>
