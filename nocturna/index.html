<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Libre - Nocturna</title>
    <link rel="stylesheet" href="src/output.css"> 
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

  <main class="w-full max-w-2xl py-12 px-6 flex flex-col items-center text-center">

    <p class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-300 text-xs sm:text-sm font-medium mb-8">
      <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
      <span>Nuevo · Jueves a sábado</span>
    </p>

    <h1 class="text-5xl sm:text-7xl font-black text-white tracking-tight mb-6">
      Rueda Nocturna
    </h1>

    <p class="text-base sm:text-xl text-neutral-400 max-w-lg leading-relaxed mb-10">
      Descubre Medellín en bici cuando se encienden las luces
    </p>

    <section aria-label="Información clave de la ruta" class="grid grid-cols-2 gap-4 w-full max-w-md mb-10 p-6 rounded-2xl bg-neutral-900 border border-neutral-800 shadow-2xl">
      <article class="flex flex-col items-center justify-center p-3 border-r border-neutral-800">
        <strong class="text-2xl sm:text-3xl font-black text-white">3 rutas</strong>
        <span class="text-xs text-neutral-400 uppercase tracking-widest mt-1 font-semibold">Recorridos</span>
      </article>
      <article class="flex flex-col items-center justify-center p-3">
        <strong class="text-2xl sm:text-3xl font-black text-white">Desde $55.000</strong>
        <span class="text-xs text-neutral-400 uppercase tracking-widest mt-1 font-semibold">Precio</span>
      </article>
    </section>

    <nav class="flex flex-col sm:flex-row items-center justify-center gap-4 p-6 bg-black">

        <a href="#inscribete" 
            class="inline-flex items-center justify-center px-6 py-3 text-sm font-bold text-black bg-white rounded-xl hover:bg-neutral-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-black active:scale-95 transition-all duration-200 shadow-md">
            Inscríbete ahora
        </a>

        <a href="#rutas" 
            class="inline-flex items-center justify-center px-6 py-3 text-sm font-bold text-white bg-neutral-900/40 border border-neutral-700 rounded-xl hover:bg-neutral-800 hover:border-neutral-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black active:scale-95 transition-all duration-200">
            Ver recorridos
        </a>

        <a href="#mas-info" 
            class="inline-flex items-center justify-center px-6 py-3 text-sm font-semibold text-black bg-white rounded-xl hover:bg-neutral-200  focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-black active:scale-95 transition-all duration-200">
            Más información
        </a>

    </nav>

  </main>

</body>
</html>
